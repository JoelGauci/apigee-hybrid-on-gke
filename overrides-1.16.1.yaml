# This file is generated by the Apigee Hybrid deployment script
instanceID: "apigee-hybrid-1"
namespace: "apigee"
gcp:
  projectID: "apigee-h-1-16-1"
  region: "europe-west1"
  workloadIdentity:
    enabled: true
org: "apigee-h-1-16-1"

k8sCluster:
  name: "apigee-hybrid"
  region: "europe-west1"

# Component Workload Identity References
mart:
  gsa: "apigee-mart@apigee-h-1-16-1.iam.gserviceaccount.com"

connectAgent:
  gsa: "apigee-mart@apigee-h-1-16-1.iam.gserviceaccount.com"

metrics:
  gsa: "apigee-metrics@apigee-h-1-16-1.iam.gserviceaccount.com"

synchronizer:
  gsa: "apigee-synchronizer@apigee-h-1-16-1.iam.gserviceaccount.com"

watcher:
  gsa: "apigee-watcher@apigee-h-1-16-1.iam.gserviceaccount.com"

guardrails:
  gsa: "apigee-guardrails@apigee-h-1-16-1.iam.gserviceaccount.com"

logger:
  enabled: true
  gsa: "apigee-logger@apigee-h-1-16-1.iam.gserviceaccount.com"

runtime:
  gsa: "apigee-runtime@apigee-h-1-16-1.iam.gserviceaccount.com"
  replicaCountMin: 2
  replicaCountMax: 5

mintTaskScheduler:
  gsa: "apigee-mint-task-scheduler@apigee-h-1-16-1.iam.gserviceaccount.com"

cassandra:
  # Set to false for single region installations and  for multi-region
  # installations with connectivity between pods in different clusters,
  # like GKE.
  # Set to true for multi-region installations with no communication
  # between pods in different clusters, for example Google Distributed
  # Cloud on VMware or bare metal, GKE on AWS, AKS, EKS, and OpenShift.
  # See Multi-region deployment: Prerequisites
  hostNetwork: false
  replicaCount: 3
  storage:
    storageclass: "apigee-sc"

envs:
  - name: "test"
    gsa:
      synchronizer: "apigee-synchronizer@apigee-h-1-16-1.iam.gserviceaccount.com"
      runtime: "apigee-runtime@apigee-h-1-16-1.iam.gserviceaccount.com"

enhanceProxyLimits: true

ingressGateways:
  - name: apigee-ingress
    replicaCountMin: 2
    replicaCountMax: 10
    svcLoadBalancerIP: 34.38.227.149
    svcType: LoadBalancer

virtualhosts:
  - name: "test-group"
    selector:
      app: apigee-ingressgateway
      ingress_name: apigee-ingress
    sslSecret: "apigee-tls-secret"
